# Alternative Wrangler configuration for Workers-only deployment
# Use this if you prefer Workers service over Pages

name = "rootrush-workers"
type = "service"
main = "functions/[[path]].js"
compatibility_date = "2024-04-01"
workers_dev = true

# Assets configuration - for serving static files
[assets]
directory = "static"

# Analytics
[analytics]
enabled = true

# Observability
[observability]
enabled = true

# Build configuration
[build]
command = "npm install"
cwd = "./"

# Development environment
[env.development]
name = "rootrush-dev"
vars = { 
  ENVIRONMENT = "development",
  LOG_LEVEL = "debug",
  BACKEND_URL = "http://localhost:5000"
}

# Staging environment
[env.staging]
name = "rootrush-staging"
routes = [
  { pattern = "staging.yourdomain.com/*", zone_name = "yourdomain.com" }
]
vars = {
  ENVIRONMENT = "staging",
  LOG_LEVEL = "info",
  BACKEND_URL = "https://staging-api.yourdomain.com"
}

# Production environment
[env.production]
name = "rootrush"
routes = [
  { pattern = "yourdomain.com/*", zone_name = "yourdomain.com" },
  { pattern = "www.yourdomain.com/*", zone_name = "yourdomain.com" }
]
vars = {
  ENVIRONMENT = "production",
  LOG_LEVEL = "error",
  BACKEND_URL = "https://api.yourdomain.com"
}
